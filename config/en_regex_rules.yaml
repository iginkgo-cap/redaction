# EN / 通用正则规则（家办金融场景精选 8 条）
# 借鉴自 Presidio (microsoft/presidio MIT) predefined_recognizers/
# 详见 ATTRIBUTIONS.md
#
# 字段说明：
#   name        - 规则唯一名（raw_label，用于 source 标识 + canonical 反查）
#   canonical   - 在 canonical.yaml:en_regex 表中查映射
#   pattern     - Python regex 字符串（支持 regex 库的 \p{...}）
#   validator   - 可选；python-stdnum 子模块名（如 luhn / iban / bic）
#                 调用 .is_valid(text) 返回 True 才保留
#   score       - 0.0-1.0，merge 时作为同优先级排序依据
#   flags       - 可选；regex 标志（如 IGNORECASE）

rules:
  - name: EMAIL
    canonical: EMAIL
    # RFC5322 简化
    pattern: '(?<![A-Za-z0-9._%+-])[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}(?![A-Za-z0-9.])'
    score: 0.95

  # S5 (round11): 全量 URL 识别下线——生产 84/84 条 URL 均为公开网站、0 条含敏感信息，
  # 且用户在 exclusion 中持续取消 URL 脱敏。仅保留三类敏感特征 URL：
  - name: URL_USERINFO
    canonical: URL
    # 含 user:pass@ 凭据段的 URL
    pattern: '\bhttps?://[^\s/@:]+:[^\s/@]+@[^\s\)\]\}<>"'',]+'
    score: 0.97

  - name: URL_CREDENTIAL
    canonical: URL
    # query 含凭据参数（token/key/secret/password/signature/session）
    pattern: '\bhttps?://[^\s\)\]\}<>"'',]*[?&](?:access_token|token|api_?key|secret|password|pwd|signature|sig|session|sid|auth)=[^\s\)\]\}<>"'',]+'
    flags: IGNORECASE
    score: 0.95

  - name: URL_INTERNAL
    canonical: URL
    # host 为本机/内网网段（RFC 1918）的 URL，暴露内部拓扑
    pattern: '\bhttps?://(?:localhost|127\.\d{1,3}\.\d{1,3}\.\d{1,3}|10\.\d{1,3}\.\d{1,3}\.\d{1,3}|192\.168\.\d{1,3}\.\d{1,3}|172\.(?:1[6-9]|2\d|3[01])\.\d{1,3}\.\d{1,3})(?::\d+)?(?:[^\s\)\]\}<>"'',]*)?'
    score: 0.9

  - name: CREDIT_CARD
    canonical: BANK_CARD
    # 13-19 位数字，允许空格/-分组；validator Luhn
    pattern: '(?<!\d)(?:\d{4}[ -]?){3,4}\d{1,4}(?!\d)'
    validator: luhn
    score: 0.92

  - name: IBAN
    canonical: BANK_CARD
    # ISO 13616: 2字母国家码 + 2位校验 + 11-30 alnum
    pattern: '(?<![A-Z0-9])[A-Z]{2}\d{2}[A-Z0-9]{11,30}(?![A-Z0-9])'
    validator: iban
    score: 0.95

  - name: SWIFT_BIC
    canonical: BANK_CARD
    # ISO 9362: 4字母银行码 + 2字母国家码 + 2 alnum 位置码 + 可选 3 alnum 分行码
    pattern: '(?<![A-Z0-9])[A-Z]{4}[A-Z]{2}[A-Z0-9]{2}(?:[A-Z0-9]{3})?(?![A-Z0-9])'
    validator: bic
    score: 0.9

  - name: CRYPTO_ADDR
    canonical: CRYPTO_ADDR
    # BTC bech32 / BTC P2PKH/P2SH (legacy 1.../3...) / ETH 40 hex / TRX T+33 Base58
    pattern: '(?<![A-Za-z0-9])(?:bc1[0-9a-z]{25,90}|[13][a-km-zA-HJ-NP-Z1-9]{25,34}|0x[a-fA-F0-9]{40}|T[1-9A-HJ-NP-Za-km-z]{33})(?![A-Za-z0-9])'
    score: 0.85

  - name: PASSPORT_GENERIC
    canonical: ID_CARD
    # 通用护照：1-2 字母 + 6-9 位数字 + 可选尾校验字母（宽松，避免命中纯数字银行卡）。
    # 覆盖：中国 E+8 / EA·EB·EJ… 双字母系列、新加坡 K1234567X（尾字母）。score 低，靠 overlap 让强字段优先。
    pattern: '(?<![A-Za-z0-9])[A-Z]{1,2}\d{6,9}[A-Z]?(?![A-Za-z0-9])'
    score: 0.6

  - name: PHONE_INTL
    canonical: PHONE
    # E.164 国际电话：必须 + 开头，国家码 1-3 位 + 4-14 位号码（允许 - / . / 空格 / 括号分组）
    # 避免误识 IBAN / 银行卡 / 版本号 / URL 里的 +1 等
    pattern: '(?<![\d+])\+\d{1,3}[\s.\-]?(?:\(?\d{1,4}\)?[\s.\-]?){2,5}\d{2,4}(?![\d])'
    score: 0.9

  # T12: API_KEY 系列（参考 BigCode PII secret patterns，使用各平台官方公开格式）
  - name: API_KEY_OPENAI
    canonical: API_KEY
    # sk-... 或 sk-proj-...（OpenAI 现行格式：32-64 字符 Base64-like）
    pattern: '(?<![A-Za-z0-9])sk-(?:proj-)?[A-Za-z0-9_-]{20,}(?![A-Za-z0-9])'
    score: 0.97

  - name: API_KEY_AWS
    canonical: API_KEY
    # AWS Access Key ID: 20 char AKIA/ASIA + 16 alnum
    pattern: '(?<![A-Za-z0-9])(?:AKIA|ASIA)[A-Z0-9]{16}(?![A-Za-z0-9])'
    score: 0.99

  - name: API_KEY_GITHUB
    canonical: API_KEY
    # GitHub PAT: ghp_/gho_/ghu_/ghs_/ghr_ + 36 alnum
    pattern: '(?<![A-Za-z0-9])gh[pousr]_[A-Za-z0-9]{36,}(?![A-Za-z0-9])'
    score: 0.99

  - name: API_KEY_SLACK
    canonical: API_KEY
    # Slack / Lark Bot tokens: xoxb-/xoxa-/xoxp- + 多段数字-字符
    pattern: '(?<![A-Za-z0-9])xox[abpsroev]-[A-Za-z0-9-]{20,}(?![A-Za-z0-9])'
    score: 0.97

  - name: API_KEY_GITLAB
    canonical: API_KEY
    # GitLab PAT: glpat- + 20 alnum
    pattern: '(?<![A-Za-z0-9])glpat-[A-Za-z0-9_-]{20,}(?![A-Za-z0-9])'
    score: 0.99

  # D11: IPv4（P7 加固版；D8 曾因 FP 下线，经 26 合成 case + 334 真实语料实验后回归）
  - name: IP_ADDRESS
    canonical: IP_ADDRESS
    # 八位组主体同 Presidio（严格 0-255）；边界断言为 D8 五类 FP 场景定制加固：
    #   (?<![\w.])  挡时间戳延续(2025.10.05.18.30.22) + 版本号字母前缀(v7.0.0.1)
    #   (?![\w\-])  挡内核版本后缀(5.15.0.91-generic)
    #   (?!\.?\d)   挡点分数字延续，但放行句尾句号(from 198.51.100.155.)
    #   (?!/\d)     挡 CIDR 网段(192.168.0.0/24，拓扑描述非 PII；Presidio 原版反而匹配)
    # 已知限制：裸版本号(version 1.2.3.4 / pip 25.0.1.2)与 IP 格式同构，正则无法区分，
    # 实测 334 条评测语料中出现 0 次，残余风险由前端逐项开关兜底（见 D11）
    pattern: '(?<![\w.])(?:(?:25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)\.){3}(?:25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)(?![\w\-])(?!\.?\d)(?!/\d)'
    score: 0.6

  # T12: DOB（英文格式 May 12 1985 / January 1, 2000）
  - name: DOB_EN
    canonical: DOB
    # 月份英文全称/缩写 + 日 + 年（年份 1900-2099）
    pattern: '\b(?:Jan(?:uary)?|Feb(?:ruary)?|Mar(?:ch)?|Apr(?:il)?|May|Jun(?:e)?|Jul(?:y)?|Aug(?:ust)?|Sep(?:tember)?|Oct(?:ober)?|Nov(?:ember)?|Dec(?:ember)?)\.?\s+\d{1,2}(?:,?)\s+(?:19|20)\d{2}\b'
    score: 0.85
