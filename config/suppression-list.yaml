# S1 全局值抑制名单（round11）—— 命中即 drop 该识别结果、不脱敏
# 匹配口径：NFKC 归一 + strip + lower 精确匹配（app/precision.py::SuppressionList）
# 段结构：suppress.<CANONICAL_KIND> 仅对该 kind 生效；suppress."*" 对所有 kind 生效
#
# ⚠️ 维护规则（避免死名单）：
#   1. 基座层 = 闭集/公开数据源可枚举条目（大洲大区、ISO 语义集）——更新时对照公开源
#   2. overlay 层 = 生产 bad case 增量，每条注明来源与日期，总量控制在百条内；
#      能被结构规则（app/precision.py S2/S3）覆盖的误报不要加进名单
#   3. 具体人名慎入（全局生效、无租户维度）；公司/媒体/产品名安全
#   4. 大批量名单（如英文 given-name gazetteer）不放这里，走 scripts/build_gazetteer.py
#      生成 config/gazetteer/*（Phase 2）

suppress:
  # ── ORG：原 F7 ORG_PUBLIC 白名单迁入（app/merge.py 硬编码 → 此处，语义不变）──
