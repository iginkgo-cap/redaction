    - emea
    - european union
    # 通用指代词（生产导出 2026-07-02：被识别为 ADDRESS 的字段名）
    - mailing address
    - residential address
    - registered address
    - home address

  # ── PERSON：媒体/公司/产品名被 NER 误标 PERSON（overlay，生产导出 2026-07-02）──
  PERSON:
    - 福布斯        # 媒体（exclusion 取消 ×2）
    - openai       # 公司（exclusion 取消 ×2）
    - obsidian     # 笔记软件（字典误报）
    - markdown     # 格式名（字典误报）
    - claude       # AI 产品名；Claude 亦为法语人名，本业务语境按产品处理（字典误报）
    - claudian     # Claude 衍生词（字典误报）
    - yarle        # 导出工具名（字典误报）
    - enex         # Evernote 导出格式（字典误报）
    - stock        # 金融语境常用词；Stock 虽为罕见姓氏，本业务按词处理（字典误报）
    - or           # 逻辑词（字典误报「OR」）；Or 为罕见姓与 S2 全大写单姓宽免碰撞，按词处理
    - sow          # Statement of Work 缩写（字典误报「SOW」）；Sow 为西非姓氏与宽免碰撞，按词处理

  # ── "*"：占位符类型名本身（overlay，生产 2026-11-03）──
  # 占位符碎片（如全角 ［［PERSON_1］］）里的类型名会被 NER 当成实体：look 的 [[PERSON_473]] 值就是 "PERSON"
  # 与 app/schemas.py CANONICAL_KINDS + CUSTOM 保持一致（tests/test_precision.py 校验）
  "*":
    - person
    - phone
    - email
    - id_card
    - bank_card
    - account
    - crypto_addr
    - org
    - business_id
    - address
    - tin
    - api_key
    - dob
    - url
    - ip_address
    - custom
