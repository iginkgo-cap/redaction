  # ── ADDRESS：大洲/大区/超国家实体（闭集，基座层）+ 通用词（overlay）──
  # 粒度粗到无法定位个人，非 PII。生产 exclusion 中大洲名被用户取消 9 次。
  ADDRESS:
    # 大洲/大区（闭集）
    - 亚洲
    - 欧洲
    - 非洲
    - 北美
    - 南美
    - 北美洲
    - 南美洲
    - 大洋洲
