[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "file-masker"
version = "1.4.1"
description = "PDF keyword masking engine and offline web service"
license = { text = "AGPL-3.0-only" }
requires-python = ">=3.10"
dependencies = ["pymupdf==1.24.10"]

[project.optional-dependencies]
web = ["fastapi==0.115.6", "uvicorn==0.32.1", "python-multipart==0.0.20"]
mail = ["beautifulsoup4==4.12.3", "tomli==2.0.2; python_version < '3.11'", "tzdata==2025.2"]
dev = ["pytest==8.3.4", "httpx==0.28.1"]

[tool.setuptools.packages.find]
include = ["file_masker*"]

[tool.setuptools.package-data]
"file_masker.web" = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
